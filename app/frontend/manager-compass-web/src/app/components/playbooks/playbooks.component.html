<section class="view">
  <div class="panel-head">All guidance topics &mdash; browse without asking</div>
  <div class="playbook-grid">
    <div class="card" *ngFor="let t of topics" [style.--tc]="t.color">
      <div class="card-flag" [style.color]="t.color"><app-topic-icon [kind]="t.key" [size]="17" [color]="t.color"></app-topic-icon><span>{{ t.label }}</span></div>
      <p class="answer">{{ t.answer }}</p>

      <div class="section-label">Grounded in</div>
      <div class="sources">
        <span class="source" *ngFor="let s of t.sources" title="Real RealPage HR document — link to the current version on the RealPage Global Portal / SharePoint once confirmed">{{ s }}</span>
      </div>

      <div class="section-label">Suggested next steps</div>
      <ul class="checklist">
        <li *ngFor="let item of t.checklist; let i = index">
          <input type="checkbox" [id]="'pb-' + t.key + '-' + i" />
          <label [for]="'pb-' + t.key + '-' + i">{{ item }}</label>
        </li>
      </ul>

      <div class="escalation">
        <span class="mark">Escalation</span>
        <span>{{ t.escalation }}</span>
      </div>
    </div>
  </div>
</section>
